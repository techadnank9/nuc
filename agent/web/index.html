<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fortune Teller</title>
<style>
  :root {
    --night:#140f24; --plum:#2a1f4d; --plum2:#3b2c6e; --gold:#e3be55; --gold2:#b8891c; --cream:#f7eed2;
    --muted:#a99fc7; --line:#3d3166; --teal:#5dcaa5; --rose:#f0997b;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:radial-gradient(1200px 700px at 50% -10%, #3b2c6e 0%, var(--night) 60%); color:var(--cream);
         font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .serif { font-family:Georgia,"Iowan Old Style","Times New Roman",serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-weight:400; font-size:26px; letter-spacing:.04em; }
  header h1 span { color:var(--gold); }
  .status { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); }
  .dot { width:10px; height:10px; border-radius:50%; background:#6b6578; }
  .dot.on { background:var(--teal); box-shadow:0 0 10px var(--teal); }
  main { display:grid; grid-template-columns: 1.05fr 1fr 1.05fr; gap:20px; padding:22px 28px; height:calc(100% - 71px); }
  @media (max-width: 1050px) { main { grid-template-columns:1fr; height:auto; } }
  .panel { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; min-height:0; }
  .panel h2 { margin:0 0 10px; font:600 12px/1.2 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  video { width:100%; aspect-ratio:4/3; object-fit:cover; background:#0b0816; border-radius:12px; border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  select, input[type=text] { background:#0f0a1d; color:var(--cream); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  select { flex:1; min-width:0; }
  button { font:600 14px/1 -apple-system,Helvetica,Arial,sans-serif; border:0; border-radius:10px; padding:11px 16px; cursor:pointer; }
  .btn-gold { background:var(--gold); color:#2a1f05; } .btn-gold:hover { background:#f0cd68; }
  .btn-ghost { background:transparent; color:var(--cream); border:1px solid var(--line); } .btn-ghost:hover { border-color:var(--gold2); }
  .btn-ghost.off { color:var(--rose); border-color:var(--rose); }
  button:disabled { opacity:.4; cursor:default; }
  .stage { align-items:center; justify-content:flex-start; text-align:center; }
  .orb { width:190px; height:190px; border-radius:50%; margin:14px auto 6px; position:relative;
         background:radial-gradient(circle at 35% 30%, #fff6d8 0%, #e3be55 22%, #6b4fc9 55%, #2a1f4d 80%);
         box-shadow:0 0 40px rgba(227,190,85,.25), inset 0 0 40px rgba(20,15,36,.6); transition:transform .12s ease, box-shadow .2s; }
  .orb.speaking { box-shadow:0 0 70px rgba(227,190,85,.55), inset 0 0 30px rgba(20,15,36,.4); }
  .orb.thinking { animation: swirl 2.4s linear infinite; }
  @keyframes swirl { to { filter:hue-rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .orb.thinking { animation:none; } }
  .state { font-size:15px; color:var(--muted); min-height:24px; }
  .start { margin:16px 0 4px; }
  .card-wrap { margin-top:auto; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; min-height:290px; justify-content:flex-end; }
  .card { width:170px; height:250px; border-radius:12px; background:var(--gold2); padding:7px; transform:rotateY(90deg); transition:transform .7s ease; }
  .card.show { transform:rotateY(0deg); }
  .card .face { height:100%; border-radius:8px; background:#fbeec4; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:14px 10px 10px; color:#2a2350; }
  .card .num { font:700 13px/1 Georgia,serif; letter-spacing:.12em; color:var(--gold2); }
  .card .sym { width:96px; height:96px; }
  .card .name { background:#2a2350; color:#f7e3a8; width:100%; text-align:center; border-radius:4px; padding:6px 0; font:15px/1 Georgia,serif; letter-spacing:.06em; }
  .meaning { font-size:14px; color:var(--muted); max-width:320px; min-height:42px; }
  .drawing { font-size:14px; color:var(--gold); min-height:20px; }
  .log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; min-height:200px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:14px; font-size:15px; }
  .msg .who { display:block; font:600 11px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; margin-bottom:5px; opacity:.75; }
  .msg.teller { background:rgba(227,190,85,.12); border:1px solid rgba(227,190,85,.3); align-self:flex-start; }
  .msg.guest { background:rgba(93,202,165,.12); border:1px solid rgba(93,202,165,.3); align-self:flex-end; }
  .msg.sys { align-self:center; font-size:13px; color:var(--muted); background:none; padding:2px; }
  .composer { display:flex; gap:8px; margin-top:12px; }
  .composer input { flex:1; }
  .hint { font-size:12.5px; color:var(--muted); margin-top:8px; }
  .err { color:var(--rose); font-size:14px; min-height:20px; }
</style>
</head>
<body>
<header>
  <h1 class="serif">The <span>Fortune Teller</span></h1>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">Not connected</span></div>
</header>

<main>
  <!-- Camera -->
  <section class="panel">
    <h2>Camera</h2>
    <video id="cam" autoplay playsinline muted></video>
    <div class="row">
      <select id="camSelect" aria-label="Camera"><option>Choose a camera after starting</option></select>
      <button class="btn-ghost" id="camBtn" disabled>Camera off</button>
    </div>
    <p class="hint">Point a camera at the guest or at the robot arms. The Fortune Teller sees this camera too.</p>
  </section>

  <!-- Stage -->
  <section class="panel stage">
    <h2>The reading</h2>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <div class="state" id="state">Press begin and allow the microphone and camera.</div>
    <div class="row" style="justify-content:center">
      <button class="btn-gold start" id="startBtn">Begin the reading</button>
      <button class="btn-ghost start" id="micBtn" disabled>Mic on</button>
      <button class="btn-ghost start" id="endBtn" disabled>End</button>
    </div>
    <div class="err" id="err"></div>
    <div class="card-wrap">
      <div class="drawing" id="drawing"></div>
      <div class="card" id="card"><div class="face">
        <div class="num" id="cardNum"></div>
        <svg class="sym" id="cardSym" viewBox="0 0 100 100"></svg>
        <div class="name" id="cardName">&nbsp;</div>
      </div></div>
      <div class="meaning" id="meaning"></div>
    </div>
  </section>

  <!-- Conversation -->
  <section class="panel">
    <h2>Conversation</h2>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <input type="text" id="text" placeholder="Type a message instead of speaking…" autocomplete="off" disabled>
      <button class="btn-gold" id="sendBtn" disabled>Send</button>
    </form>
  </section>
</main>

<script type="module">
import { Room, RoomEvent, Track } from "https://esm.sh/livekit-client@2";

const $ = (id) => document.getElementById(id);
const ROMAN = {6:"VI", 8:"VIII", 10:"X", 17:"XVII", 18:"XVIII", 19:"XIX", 21:"XXI"};
const SYMBOLS = {
  19: `<circle cx="50" cy="50" r="22" fill="#f6b21b"/>${[...Array(12)].map((_,i)=>`<line x1="50" y1="18" x2="50" y2="8" stroke="#ee9420" stroke-width="5" stroke-linecap="round" transform="rotate(${i*30} 50 50)"/>`).join("")}`,
  18: `<circle cx="50" cy="50" r="30" fill="#3b2c6e"/><circle cx="46" cy="48" r="20" fill="#f3e3a8"/><circle cx="55" cy="42" r="17" fill="#3b2c6e"/>`,
  17: `<polygon points="50,10 59,38 89,40 65,58 73,88 50,71 27,88 35,58 11,40 41,38" fill="#f6c945"/>`,
  10: `<circle cx="50" cy="50" r="34" fill="none" stroke="#b8891c" stroke-width="6"/>${[...Array(8)].map((_,i)=>`<line x1="50" y1="50" x2="50" y2="18" stroke="#b8891c" stroke-width="4" transform="rotate(${i*45} 50 50)"/>`).join("")}<circle cx="50" cy="50" r="7" fill="#b8891c"/>`,
  6:  `<path d="M50 82 C20 60 18 34 34 28 C43 25 50 32 50 38 C50 32 57 25 66 28 C82 34 80 60 50 82Z" fill="#d4537e"/>`,
  8:  `<path d="M22 60 Q30 30 50 30 Q70 30 78 60 Q60 52 50 70 Q40 52 22 60Z" fill="#e09a14"/><circle cx="50" cy="44" r="6" fill="#2a2350"/>`,
  21: `<ellipse cx="50" cy="50" rx="24" ry="34" fill="none" stroke="#3b8f5c" stroke-width="7"/><circle cx="50" cy="50" r="8" fill="#3b2c6e"/>`,
};

let room = null, micOn = true, camOn = false, guestMicSid = null;
const bubbles = new Map();

function addMsg(kind, text, id) {
  let el = id && bubbles.get(id);
  if (!el) {
    el = document.createElement("div");
    el.className = `msg ${kind}`;
    el.innerHTML = kind === "sys" ? "" : `<span class="who">${kind === "teller" ? "Fortune Teller" : "You"}</span><span class="t"></span>`;
    $("log").appendChild(el);
    if (id) bubbles.set(id, el);
  }
  (el.querySelector(".t") || el).textContent = text;
  $("log").scrollTop = $("log").scrollHeight;
}

function setState(text, orbClass = "") {
  $("state").textContent = text;
  $("orb").className = "orb " + orbClass;
}

function showCard(ev) {
  const card = $("card");
  $("cardNum").textContent = ROMAN[ev.card_id] || "";
  $("cardSym").innerHTML = SYMBOLS[ev.card_id] || "";
  $("cardName").textContent = ev.name;
  $("meaning").textContent = ev.meaning;
  card.classList.remove("show"); void card.offsetWidth; card.classList.add("show");
}

async function listCameras() {
  const cams = await Room.getLocalDevices("videoinput");
  $("camSelect").innerHTML = cams.map(c => `<option value="${c.deviceId}">${c.label || "Camera"}</option>`).join("") || "<option>No camera found</option>";
}

async function setCamera(on) {
  camOn = on;
  await room.localParticipant.setCameraEnabled(on, on ? { deviceId: $("camSelect").value || undefined } : undefined);
  const pub = room.localParticipant.getTrackPublication(Track.Source.Camera);
  if (on && pub?.track) pub.track.attach($("cam")); else $("cam").srcObject = null;
  $("camBtn").textContent = on ? "Camera off" : "Camera on";
}

async function start() {
  $("err").textContent = "";
  $("startBtn").disabled = true;
  setState("Summoning the Fortune Teller…", "thinking");
  try {
    const res = await fetch("/token");
    if (!res.ok) throw new Error(`token server answered ${res.status}`);
    const { url, token } = await res.json();
    room = new Room({ adaptiveStream: true, dynacast: true });

    room.registerTextStreamHandler("lk.transcription", async (reader, from) => {
      const id = reader.info.id;
      const track = reader.info.attributes?.["lk.transcribed_track_id"];
      const isGuest = (guestMicSid && track === guestMicSid) || from.identity === room.localParticipant.identity;
      let text = "";
      for await (const chunk of reader) { text += chunk; addMsg(isGuest ? "guest" : "teller", text, id); }
    });
    room.registerTextStreamHandler("fortune.events", async (reader) => {
      const ev = JSON.parse(await reader.readAll());
      if (ev.state === "drawing") { $("drawing").textContent = ev.attempt > 1 ? "The hand reaches again…" : "The hand reaches into the deck…"; $("card").classList.remove("show"); $("meaning").textContent = ""; }
      if (ev.state === "card") { $("drawing").textContent = "The card is revealed"; showCard(ev); }
      if (ev.state === "failed") { $("drawing").textContent = ev.retry ? "The spirits are hesitant… set the card back in the deck." : "The cards are tired tonight."; }
      if (ev.state === "not_ready") { $("drawing").textContent = "The deck is being prepared…"; }
    });

    room.on(RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === Track.Kind.Audio) { const el = track.attach(); el.hidden = true; document.body.appendChild(el); }
    });
    room.on(RoomEvent.ParticipantAttributesChanged, (changed, p) => {
      if (p.isLocal || !("lk.agent.state" in changed)) return;
      const s = changed["lk.agent.state"];
      setState({ listening: "Listening…", thinking: "Consulting the spirits…", speaking: "The Fortune Teller speaks", initializing: "Awakening…" }[s] || s,
               { thinking: "thinking", speaking: "speaking" }[s] || "");
    });
    room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
      const teller = speakers.find(p => !p.isLocal);
      $("orb").style.transform = teller ? `scale(${1 + Math.min(teller.audioLevel * 1.5, .12)})` : "scale(1)";
    });
    room.on(RoomEvent.Disconnected, () => end(true));

    await room.connect(url, token);
    await room.startAudio();
    try {
      await room.localParticipant.setMicrophoneEnabled(true);
      guestMicSid = room.localParticipant.getTrackPublication(Track.Source.Microphone)?.trackSid || null;
    } catch (e) {
      micOn = false; $("micBtn").textContent = "Mic off"; $("micBtn").classList.add("off");
      addMsg("sys", "Microphone unavailable (" + e.message + "): type your messages below.");
    }
    try { await listCameras(); await setCamera(true); }
    catch (e) { camOn = false; $("camBtn").textContent = "Camera on"; addMsg("sys", "Camera unavailable (" + e.message + ")."); }

    $("dot").classList.add("on"); $("conn").textContent = "Connected";
    ["micBtn", "endBtn", "camBtn", "text", "sendBtn"].forEach(id => $(id).disabled = false);
    setState("Awakening…", "thinking");
  } catch (e) {
    $("err").textContent = "Could not start: " + e.message;
    $("startBtn").disabled = false;
    setState("Press begin to try again.");
  }
}

async function end(fromEvent = false) {
  if (room && !fromEvent) await room.disconnect();
  room = null;
  $("dot").classList.remove("on"); $("conn").textContent = "Not connected";
  ["micBtn", "endBtn", "camBtn", "text", "sendBtn"].forEach(id => $(id).disabled = true);
  $("startBtn").disabled = false; $("cam").srcObject = null;
  setState("The reading has ended. Press begin for a new guest.");
}

$("startBtn").onclick = start;
$("endBtn").onclick = () => end();
$("micBtn").onclick = async () => {
  micOn = !micOn;
  await room.localParticipant.setMicrophoneEnabled(micOn);
  $("micBtn").textContent = micOn ? "Mic on" : "Mic off";
  $("micBtn").classList.toggle("off", !micOn);
};
$("camBtn").onclick = () => setCamera(!camOn);
$("camSelect").onchange = () => { if (room && camOn) setCamera(true); };
$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !room) return;
  $("text").value = "";
  addMsg("guest", text);
  await room.localParticipant.sendText(text, { topic: "lk.chat" });
};
</script>
</body>
</html>
